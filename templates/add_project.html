{% extends "base.html" %}

{% block title %}Add Project - MR EARN & CONNECT{% endblock %}

{% block content %}
<div class="container" style="max-width: 760px; padding-top: 1.5rem;">
  
  <div class="card" style="padding: 2.5rem 2rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 1rem;">
      <div>
        <h2 style="font-size: 1.8rem;">🛠️ Add Student Project</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Showcase software, hardware, or research prototypes to recruiters</p>
      </div>
      <a href="{{ url_for('projects') }}" class="btn btn-outline btn-sm">&larr; Projects</a>
    </div>

    <form method="POST" action="{{ url_for('add_project') }}">
      
      <div class="form-group">
        <label class="form-label" for="title">Project Title *</label>
        <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Smart Campus Assistant" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="category">Category *</label>
          <select id="category" name="category" class="form-control">
            <option value="Web & Software">Web &amp; Software</option>
            <option value="AI & Automation">AI &amp; Automation</option>
            <option value="Mobile Application">Mobile Application</option>
            <option value="IoT & Hardware">IoT &amp; Hardware</option>
            <option value="Desktop Software">Desktop Software</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="status">Project Status *</label>
          <select id="status" name="status" class="form-control">
            <option value="Completed" selected>Completed</option>
            <option value="In Progress">In Progress</option>
            <option value="Prototype">Prototype</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="technologies">Technologies Used (Comma-separated) *</label>
        <input type="text" id="technologies" name="technologies" class="form-control" placeholder="e.g. Python, Flask, SQLite, HTML, CSS" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="team_members">Team Members (Names)</label>
          <input type="text" id="team_members" name="team_members" class="form-control" placeholder="e.g. Arjun Kumar, Rahul Sharma">
        </div>

        <div class="form-group">
          <label class="form-label" for="project_link">GitHub / Project Link</label>
          <input type="url" id="project_link" name="project_link" class="form-control" placeholder="https://github.com/username/project">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="description">Project Description *</label>
        <textarea id="description" name="description" class="form-control" rows="4" placeholder="Highlight the problem addressed, core functionality, architecture, and results achieved..." required></textarea>
      </div>

      <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary" style="flex: 1;">Publish to Project Showcase &rarr;</button>
        <a href="{{ url_for('projects') }}" class="btn btn-outline">Cancel</a>
      </div>

    </form>
  </div>

</div>
{% endblock %}
